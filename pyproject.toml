[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "danish-spike-radar"
version = "1.0.0"
description = "Danish price-spike probabilities and auditable paper cap hedging"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3"]

[project.scripts]
spikeradar = "spikeradar.cli:main"

[tool.setuptools.packages.find]
include = ["spikeradar*"]

